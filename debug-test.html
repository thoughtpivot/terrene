<!DOCTYPE html>
<html>
<head><title>Terrene Debug Test</title></head>
<body>
    <h1>GitHub Pages Debug Test</h1>
    <div id="log"></div>
    <script>
        const log = document.getElementById('log');
        function addLog(msg) {
            log.innerHTML += '<p>' + msg + '</p>';
        }
        
        // Test 1: TMX
        fetch('./src/components/cities/Eldergrove/Eldergrove.tmx')
            .then(r => addLog('TMX: ' + r.status + ' ' + r.statusText))
            .catch(e => addLog('TMX Error: ' + e));
        
        // Test 2: PNG from root
        fetch('./src/assets/roguelike-pack/Spritesheet/roguelikeSheet_transparent.png')
            .then(r => addLog('PNG: ' + r.status + ' ' + r.statusText))
            .catch(e => addLog('PNG Error: ' + e));
    </script>
</body>
</html>
